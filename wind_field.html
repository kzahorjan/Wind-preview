<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Canvas</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff;
    color:#000; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif; }
  canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #ui { position:fixed; top:22px; left:24px; z-index:3; font-size:11px; line-height:1.45;
    letter-spacing:.01em; pointer-events:none;
    background:rgba(255,255,255,.9); border:1px solid #000; padding:10px 14px; }
  #title { font-size:14px; margin-bottom:7px; }
  #data { opacity:.65; }
  #location { margin-top:3px; opacity:.45; }
  #controls { position:fixed; right:24px; top:22px; z-index:3; display:flex; gap:6px; }
  button, input { border:1px solid #000; background:#fff; color:#000; padding:6px 9px;
    font:11px inherit; cursor:pointer; }
  button:hover { background:#000; color:#fff; }
  #city-search { width:160px; }
  #city-search:focus { outline:none; background:#f3f3f3; }
  #hint { position:fixed; left:24px; bottom:20px; z-index:3; font-size:10px;
    background:rgba(255,255,255,.9); border:1px solid #000; padding:6px 10px; }
  #hint a { color:#000; text-decoration:underline; }
  #hint a:hover { opacity:.55; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div id="title">Wind Canvas</div>
  <div id="data">Connecting to Open-Meteo…</div>
  <div id="location">Using browser location · fallback: Bratislava</div>
</div>

<div id="controls">
  <input type="text" id="city-search" list="city-results" placeholder="search city…" autocomplete="off">
  <datalist id="city-results"></datalist>
  <button id="reset">reset</button>
</div>

<div id="hint">source: <a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo.com</a></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const dataEl = document.getElementById("data");
const locationEl = document.getElementById("location");

let W, H, dpr;
let arrows = [];
let running = true;
let lastT = null;

// Values actually used for drawing — these ease toward the *target values
// whenever fresh API data arrives, instead of snapping instantly.
let windSpeed = 4, windDir = 270, gust = 5;
let targetWindSpeed = 4, targetWindDir = 270, targetGust = 5;
let cloudCover = 50, targetCloudCover = 50;
let temp = 15, targetTemp = 15;

// Cursor disturbs nearby marks — reads the crosshair as a little probe.
let mouseX = -9999, mouseY = -9999, mouseActive = false;

let clouds = [];
let elapsed = 0;

const COUNT = 800;
const WORLD_SCALE = 1.35;
const EASE_TAU = 6; // seconds — how gently the field eases toward new readings
const WORD = "wind";

function fontSizeFor(size) {
  return (9 + size*7) * 2/3;
}
function speedLabel() {
  return windSpeed.toFixed(1) + " m/s";
}
function computeCharOffsets(word, fontSize) {
  ctx.font = "400 " + fontSize.toFixed(1) + "px Inter, sans-serif";
  const offsets = [];
  let x = 0;
  for (let i=0; i<word.length; i++) {
    offsets.push(x);
    x += ctx.measureText(word[i]).width;
  }
  return offsets;
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  regenerate();
}

function regenerate() {
  arrows = [];
  for (let i=0; i<COUNT; i++) arrows.push(makeArrow());
  if (clouds.length === 0) initClouds();
  running = true;
  lastT = null;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);
}

function makeArrow() {
  const maxLife = 3 + Math.random()*5; // seconds this mark stays visible before it vanishes
  const size = .55 + Math.random()*.9;
  const fontSize = fontSizeFor(size);
  const showsSpeed = Math.random() < 0.5;
  const word = showsSpeed ? speedLabel() : WORD;
  return {
    x: Math.random()*W,
    y: Math.random()*H,
    size: size,
    fontSize: fontSize,
    showsSpeed: showsSpeed,
    word: word,
    charOffsets: computeCharOffsets(word, fontSize),
    // Fixed personal bias plus a slow independent wobble — turbulence, not noise.
    baseDeviation: (Math.random()-.5) * 0.22,
    turbAmount: 0.04 + Math.random()*0.16,
    turbFreq: 0.15 + Math.random()*0.4,
    phase: Math.random()*Math.PI*2,
    t: Math.random()*1000,
    maxLife: maxLife,
    life: Math.random()*maxLife, // staggered so marks don't all vanish in sync
    dist: Math.random()*80, // staggered starting point in the flowing word
    mouseDev: 0
  };
}

function respawn(a) {
  a.x = Math.random()*W;
  a.y = Math.random()*H;
  a.baseDeviation = (Math.random()-.5) * 0.22;
  a.turbAmount = 0.04 + Math.random()*0.16;
  a.turbFreq = 0.15 + Math.random()*0.4;
  a.phase = Math.random()*Math.PI*2;
  a.maxLife = 3 + Math.random()*5;
  a.life = 0;
  a.dist = Math.random()*80;
  a.mouseDev = 0;
  a.showsSpeed = Math.random() < 0.5;
  a.word = a.showsSpeed ? speedLabel() : WORD;
  a.charOffsets = computeCharOffsets(a.word, a.fontSize);
}

/* ---------------- clouds — abstract blob outlines, driven by cloud_cover ---------------- */
function makeCloud() {
  const baseR = 40 + (targetCloudCover/100)*95 + Math.random()*70;
  const n = 7 + Math.floor(Math.random()*4);
  const pts = [];
  for (let i=0; i<n; i++) {
    pts.push({
      ang: (i/n) * Math.PI*2,
      rBase: baseR * (0.7 + Math.random()*0.6),
      wobFreq: 0.08 + Math.random()*0.2,
      wobAmt: baseR*0.12,
      phase: Math.random()*Math.PI*2,
    });
  }
  return { cx: Math.random()*W, cy: Math.random()*H*0.8, pts, pvx: 0, pvy: 0, radius: baseR };
}
function cloudTargetCount() {
  return Math.round((targetCloudCover/100) * 24); // 0 (clear) .. 24 (overcast)
}
function initClouds() {
  clouds = [];
  const n = cloudTargetCount();
  for (let i=0; i<n; i++) clouds.push(makeCloud());
}
function syncCloudCount() {
  const desired = cloudTargetCount();
  while (clouds.length < desired) clouds.push(makeCloud());
  while (clouds.length > desired) clouds.pop();
}

function stepClouds(dt) {
  const baseRad = windDir * Math.PI/180;
  const speed = 1 + windSpeed*0.5; // clouds drift slower than the ground-level field — a parallax layer
  const windVX = Math.sin(baseRad) * speed;
  const windVY = -Math.cos(baseRad) * speed;
  const pushRadius = 260;
  const pushStrength = 420; // px/s target velocity right at the cursor
  const pushTau = 0.35;     // how quickly a cloud responds when pushed
  const relaxTau = 1.4;     // how slowly it settles back once released
  const bounce = 0.55;      // energy kept on bounce (0..1)

  for (const c of clouds) {
    let targetVX = 0, targetVY = 0;
    if (mouseActive) {
      const dx = c.cx - mouseX, dy = c.cy - mouseY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < pushRadius && dist > 0.001) {
        const influence = Math.pow(1 - dist/pushRadius, 1.4);
        targetVX = (dx/dist) * pushStrength * influence;
        targetVY = (dy/dist) * pushStrength * influence;
      }
    }
    const pushing = targetVX !== 0 || targetVY !== 0;
    const k = 1 - Math.exp(-dt / (pushing ? pushTau : relaxTau));
    c.pvx += (targetVX - c.pvx) * k;
    c.pvy += (targetVY - c.pvy) * k;

    c.cx += (windVX + c.pvx) * dt;
    c.cy += (windVY + c.pvy) * dt;

    // Bounce off the canvas edges instead of wrapping — reflect the total
    // velocity (wind drift + push) so it visibly moves away from the wall.
    if (c.cx < c.radius) {
      c.cx = c.radius;
      const totalVX = windVX + c.pvx;
      if (totalVX < 0) c.pvx = -totalVX*bounce - windVX;
    } else if (c.cx > W - c.radius) {
      c.cx = W - c.radius;
      const totalVX = windVX + c.pvx;
      if (totalVX > 0) c.pvx = -totalVX*bounce - windVX;
    }
    if (c.cy < c.radius) {
      c.cy = c.radius;
      const totalVY = windVY + c.pvy;
      if (totalVY < 0) c.pvy = -totalVY*bounce - windVY;
    } else if (c.cy > H - c.radius) {
      c.cy = H - c.radius;
      const totalVY = windVY + c.pvy;
      if (totalVY > 0) c.pvy = -totalVY*bounce - windVY;
    }
  }
}

function drawClouds() {
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  for (const c of clouds) {
    const pts = c.pts.map(p => {
      const r = p.rBase + Math.sin(elapsed*p.wobFreq + p.phase) * p.wobAmt;
      return { x: c.cx + Math.cos(p.ang)*r, y: c.cy + Math.sin(p.ang)*r*0.6 };
    });
    const n = pts.length;
    const mid0 = { x:(pts[n-1].x+pts[0].x)/2, y:(pts[n-1].y+pts[0].y)/2 };
    ctx.beginPath();
    ctx.moveTo(mid0.x, mid0.y);
    for (let i=0; i<n; i++) {
      const cur = pts[i], next = pts[(i+1)%n];
      const midNext = { x:(cur.x+next.x)/2, y:(cur.y+next.y)/2 };
      ctx.quadraticCurveTo(cur.x, cur.y, midNext.x, midNext.y);
    }
    ctx.closePath();
    ctx.stroke();
  }
}

function tempObstacle() {
  const fontSize = Math.min(W, H) * 0.64 / 1.5;
  const marginRight = W * 0.08;
  const anchorX = W - marginRight; // text is right-aligned to this point
  const anchorY = H / 2;
  const approxWidth = fontSize * 1.05; // rough width of a 2-3 char label at this size
  return {
    fontSize,
    anchorX, anchorY,
    x: anchorX - approxWidth * 0.5, // approximate visual center, used for the flow obstacle
    y: anchorY,
    radius: fontSize * 0.52,
  };
}

function drawTemperature() {
  const label = Math.round(temp) + "°";
  const o = tempObstacle();

  ctx.save();
  ctx.font = "400 " + o.fontSize.toFixed(0) + "px Inter, sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.fillStyle = "transparent"; // no fill — outline only
  if ("letterSpacing" in ctx) ctx.letterSpacing = (-o.fontSize * 0.045) + "px";
  ctx.strokeText(label, o.anchorX, o.anchorY);
  ctx.restore();
}

function shortestAngleDelta(a, b) {
  return ((b - a + 540) % 360) - 180;
}

function stepField(dt) {
  // Ease the drawn wind values toward whatever the API last reported.
  const k = 1 - Math.exp(-dt / EASE_TAU);
  windSpeed += (targetWindSpeed - windSpeed) * k;
  gust      += (targetGust - gust) * k;
  windDir   += shortestAngleDelta(windDir, targetWindDir) * k;
  windDir   = (windDir + 360) % 360;
  cloudCover += (targetCloudCover - cloudCover) * k;
  temp += (targetTemp - temp) * k;

  const baseRad = windDir * Math.PI / 180;
  const gustBoost = 1 + Math.max(0, gust - windSpeed) * 0.15;
  const driftBase = 3 + windSpeed * 2.2;

  for (const a of arrows) {
    a.t += dt;
    a.life += dt;
    if (a.life >= a.maxLife) { respawn(a); continue; }

    let dev = a.baseDeviation + Math.sin(a.t*a.turbFreq + a.phase) * a.turbAmount * gustBoost;

    // Cursor disturbance: nearby marks swirl slightly around the probe point.
    // Damped/eased rather than snapping instantly, so it feels smooth as the mouse moves.
    {
      const radius = 300; // enlarged scale
      let target = 0;
      if (mouseActive) {
        const dx = a.x - mouseX, dy = a.y - mouseY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < radius) {
          const influence = (1 - dist/radius);
          const swirl = Math.atan2(dy, dx) + Math.PI/2;
          target = Math.sin(swirl) * influence * 0.9;
        }
      }
      const kMouse = 1 - Math.exp(-dt / 0.4);
      a.mouseDev += (target - a.mouseDev) * kMouse;
      dev += a.mouseDev;
    }

    a.radians = baseRad + dev;

    const speedPx = driftBase * a.size;
    a.x += Math.sin(a.radians) * speedPx * dt;
    a.y -= Math.cos(a.radians) * speedPx * dt;
    a.dist += speedPx * dt;

    if (a.x < 0) a.x += W;
    if (a.x > W) a.x -= W;
    if (a.y < 0) a.y += H;
    if (a.y > H) a.y -= H;
  }
}

function draw() {
  // Fully opaque clear — no accumulated history, no fading tail. Each mark is drawn
  // at the same flat opacity for its whole life, then simply disappears (see respawn()).
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "#000";
  ctx.globalAlpha = 1;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  for (const a of arrows) {
    // Keep the word upright and readable no matter which way the wind points —
    // without this, letters flip upside-down whenever the direction points "backward".
    // (A pure rotation never reverses reading order, so the letter sequence stays as-is.)
    let rot = a.radians - Math.PI/2;
    rot = ((rot + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI;
    if (rot > Math.PI/2 || rot < -Math.PI/2) {
      rot += (rot > 0 ? -Math.PI : Math.PI);
    }

    ctx.font = "400 " + a.fontSize.toFixed(1) + "px Inter, sans-serif";
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(rot);
    for (let i=0; i<a.word.length; i++) {
      ctx.fillText(a.word[i], a.charOffsets[i], 0);
    }
    ctx.restore();
  }

  drawClouds();
  drawTemperature();
}

let lastSpeedLabel = null;
function refreshSpeedLabels() {
  const label = speedLabel();
  if (label === lastSpeedLabel) return;
  lastSpeedLabel = label;
  for (const a of arrows) {
    if (a.showsSpeed) {
      a.word = label;
      a.charOffsets = computeCharOffsets(label, a.fontSize);
    }
  }
}

function tick(t) {
  if (!running) return;
  if (lastT === null) lastT = t;
  let dt = (t - lastT) / 1000;
  dt = Math.min(dt, 0.05); // guard against big jumps (tab switches, etc.)
  lastT = t;
  elapsed += dt;

  stepField(dt);
  stepClouds(dt);
  refreshSpeedLabels();
  draw();
  requestAnimationFrame(tick);
}

/* ---------------- location & wind data ---------------- */
const GEO_LOCATION = { name: "My location", lat: null, lon: null };
let currentLocation = GEO_LOCATION;

async function fetchWindFor(lat, lon, place, forceCloudRefresh) {
  const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,temperature_2m` +
    `&wind_speed_unit=ms`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    targetWindSpeed = Number(d.current.wind_speed_10m ?? targetWindSpeed);
    // API gives meteorological convention (direction the wind blows FROM).
    // Our field moves marks TOWARD where the wind is going, so flip it 180°.
    let metDir = null;
    if (d.current.wind_direction_10m != null) {
      metDir = Number(d.current.wind_direction_10m);
      targetWindDir = (metDir + 180) % 360;
    }
    targetGust = Number(d.current.wind_gusts_10m ?? targetWindSpeed);
    targetCloudCover = Number(d.current.cloud_cover ?? targetCloudCover);
    targetTemp = Number(d.current.temperature_2m ?? targetTemp);
    // On a deliberate location switch, redraw the whole sky so it's obviously different —
    // a quiet background refresh just nudges the count so it doesn't visually jump.
    if (forceCloudRefresh) initClouds(); else syncCloudCount();

    dataEl.textContent =
      `${targetWindSpeed.toFixed(1)} m/s  ·  ${Math.round(metDir ?? (targetWindDir+180)%360)}°  ·  gust ${targetGust.toFixed(1)} m/s  ·  clouds ${Math.round(targetCloudCover)}%`;
    locationEl.textContent = place + " · updated " +
      new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  } catch(e) {
    dataEl.textContent = "Could not reach Open-Meteo";
  }
}

async function refreshWind(forceCloudRefresh) {
  const loc = currentLocation;
  if (loc.lat === null) {
    let lat = 48.1486, lon = 17.1077, place = "Bratislava";
    try {
      const pos = await new Promise((resolve,reject) =>
        navigator.geolocation.getCurrentPosition(resolve,reject,{timeout:5000})
      );
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      place = "your location";
    } catch(e) {}
    await fetchWindFor(lat, lon, place, forceCloudRefresh);
  } else {
    await fetchWindFor(loc.lat, loc.lon, loc.name, forceCloudRefresh);
  }
}

/* ---------------- searchable city input (Open-Meteo geocoding) ---------------- */
const citySearch = document.getElementById("city-search");
const cityResults = document.getElementById("city-results");
let searchResultsByLabel = {};
let searchDebounce = null;

async function searchCities(query) {
  if (!query || query.length < 2) { cityResults.innerHTML = ""; return; }
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en`;
    const r = await fetch(url);
    const d = await r.json();
    searchResultsByLabel = {};
    cityResults.innerHTML = (d.results || []).map(c => {
      const parts = [c.name, c.admin1, c.country].filter(Boolean);
      const label = parts.join(", ");
      searchResultsByLabel[label] = { name: c.name, lat: c.latitude, lon: c.longitude };
      return `<option value="${label}"></option>`;
    }).join("");
  } catch(e) {}
}

citySearch.addEventListener("input", () => {
  clearTimeout(searchDebounce);
  const query = citySearch.value;
  searchDebounce = setTimeout(() => searchCities(query), 300);
});

citySearch.addEventListener("change", () => {
  const match = searchResultsByLabel[citySearch.value];
  if (!match) return;
  currentLocation = match;
  locationEl.textContent = "Loading " + match.name + "…";
  refreshWind(true);
  citySearch.value = "";
  cityResults.innerHTML = "";
});


document.getElementById("reset").onclick = regenerate;

canvas.addEventListener("mousemove", (e) => {
  mouseX = e.clientX; mouseY = e.clientY; mouseActive = true;
});
canvas.addEventListener("mouseleave", () => { mouseActive = false; });

addEventListener("resize", resize);
resize();
refreshWind();
setInterval(refreshWind, 60000);
requestAnimationFrame(tick);
</script>
</body>
</html>
